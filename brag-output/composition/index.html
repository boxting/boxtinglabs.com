<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Boxting Labs — loop</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: 'Instrument Serif'; font-style: normal; font-weight: 400; src: url(assets/fonts/serif.woff2) format('woff2'); }
      @font-face { font-family: 'Instrument Serif'; font-style: italic; font-weight: 400; src: url(assets/fonts/serif-italic.woff2) format('woff2'); }
      @font-face { font-family: 'DM Sans'; font-style: normal; font-weight: 500 700; src: url(assets/fonts/dmsans.woff2) format('woff2'); }
      @font-face { font-family: 'DM Mono'; font-style: normal; font-weight: 400; src: url(assets/fonts/dmmono-400.woff2) format('woff2'); }
      @font-face { font-family: 'DM Mono'; font-style: normal; font-weight: 500; src: url(assets/fonts/dmmono-500.woff2) format('woff2'); }

      :root {
        --ink: #08090b;
        --cream: #f8f3eb;
        --muted: #8a92a1;
        --orange: #fe5d1c;
        --mint: #7cd6b4;
        --sky: #7da3ff;
      }
      body { margin: 0; background: var(--ink); color: var(--cream); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--ink); }
      .clip { position: absolute; inset: 0; }

      /* ambient field */
      .glow { position: absolute; border-radius: 50%; pointer-events: none; }
      #glow-orange { width: 1500px; height: 1500px; left: 820px; top: -200px;
        background: radial-gradient(closest-side, rgba(254,93,28,.24), rgba(254,93,28,.07) 45%, rgba(254,93,28,0)); }
      #glow-sky { width: 1300px; height: 1300px; left: -420px; top: -820px;
        background: radial-gradient(closest-side, rgba(43,92,230,.2), rgba(43,92,230,0)); }
      #glow-plum { width: 900px; height: 900px; left: 420px; top: 620px;
        background: radial-gradient(closest-side, rgba(110,47,102,.22), rgba(110,47,102,0)); }
      #floor { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }

      /* brand */
      #brand { position: absolute; left: 120px; top: 92px; display: flex; align-items: center; gap: 18px; }
      #brand svg { width: 62px; height: 68px; display: block; }
      .wordmark { display: flex; flex-direction: column; line-height: 1; }
      .wordmark b { font: 700 50px/1 'DM Sans', sans-serif; letter-spacing: -1px; }
      .wordmark span { font: 500 15px/1 'DM Mono', monospace; letter-spacing: 7px; color: var(--orange); margin-top: 8px; margin-left: 2px; }

      /* headline */
      #headline { position: absolute; left: 112px; top: 280px; width: 1080px;
        font-family: 'Instrument Serif', Georgia, serif; font-size: 150px; line-height: 1.1; letter-spacing: -2px; }
      .line { display: block; height: 166px; white-space: nowrap; }
      .ch { display: none; }
      .caret { display: inline-block; width: 8px; height: 122px; margin-left: 8px; vertical-align: -14px;
        background: var(--orange); border-radius: 3px; opacity: 0; }
      #accent-wrap { display: block; overflow: hidden; height: 186px; }
      #accent { display: block; font-style: italic; opacity: 0;
        background: linear-gradient(90deg, #fe5d1c, #ff8d5c); -webkit-background-clip: text; background-clip: text; color: transparent; }

      #foot { position: absolute; left: 120px; bottom: 92px; display: flex; align-items: center; gap: 16px;
        font: 500 26px/1 'DM Mono', monospace; }
      #foot .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--mint); box-shadow: 0 0 0 8px rgba(124,214,180,.15); }
      #foot .muted { color: var(--muted); font-weight: 400; }

      /* card deck */
      #deck { position: absolute; left: 1210px; top: 340px; width: 620px; height: 500px; }
      .card { position: absolute; left: 0; top: 0; width: 620px; height: 500px; box-sizing: border-box;
        border-radius: 30px; border: 1px solid rgba(248,243,235,.12);
        background: linear-gradient(180deg, #17181c, #0f1013); box-shadow: 0 40px 80px rgba(0,0,0,.45);
        transform-origin: 50% 0%; }
      .card-head { position: absolute; left: 36px; right: 36px; top: 34px; display: flex; align-items: center;
        font: 500 23px/1 'DM Mono', monospace; letter-spacing: 3px; }
      .card-head i { width: 11px; height: 11px; border-radius: 50%; margin-right: 16px; }
      .card-head em { margin-left: auto; font-style: normal; letter-spacing: 0; font-weight: 400; color: var(--muted); }
      .shade { position: absolute; inset: -1px; border-radius: 30px; background: #08090b; pointer-events: none; z-index: 2; }
      .card svg.body { position: absolute; left: 32px; top: 76px; width: 556px; height: 417px; overflow: visible; }
    </style>
  </head>
  <body>

                <rect x="60" y="157" width="96" height="6" rx="3" fill="#F8F3EB" fill-opacity=".08" />
                <rect class="sv-bar" data-w="76" x="60" y="157" width="0" height="6" rx="3" fill="#4FA98A" />

                <rect class="web-card" x="24" y="160" width="84" height="44" rx="8" fill="#F8F3EB" fill-opacity=".06" stroke="#7DA3FF" stroke-opacity=".4" />
                <rect class="web-card" x="118" y="160" width="84" height="44" rx="8" fill="#F8F3EB" fill-opacity=".06" stroke="#7DA3FF" stroke-opacity=".4" />

    <script>
      // ---- build static pieces (deterministic) ----
      const floor = document.getElementById('floor-lines');
      let d = '';
      const horizon = 820, base = 1080;
      for (let i = -40; i <= 40; i++) d += `M${960 + i * 38} ${horizon}L${960 + i * 128} ${base}`;
      [0, 6, 16, 30, 50, 76, 108, 146, 190, 260].forEach((o) => (d += `M0 ${horizon + o}H1920`));
      const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      p.setAttribute('d', d);
      floor.appendChild(p);

      const lines = ['l1', 'l2'].map((id) => {
        const el = document.getElementById(id);
        const chars = [...el.dataset.text].map((c) => {
          const s = document.createElement('span');
          s.className = 'ch';
          s.textContent = c === ' ' ? ' ' : c;
          el.appendChild(s);
          return s;
        });
        const caret = document.createElement('span');
        caret.className = 'caret';
        el.appendChild(caret);
        return { chars, caret };
      });

      const tl = gsap.timeline({ paused: true });
      const D = 5;

      // ---- ambient drift: there and back, so frame 0 == frame end ----
      tl.to('#glow-orange', { x: -60, y: 30, duration: D / 2, ease: 'sine.inOut' }, 0)
        .to('#glow-orange', { x: 0, y: 0, duration: D / 2, ease: 'sine.inOut' }, D / 2)
        .to('#glow-sky', { x: 50, duration: D / 2, ease: 'sine.inOut' }, 0)
        .to('#glow-sky', { x: 0, duration: D / 2, ease: 'sine.inOut' }, D / 2);

      // ---- headline: typed, then the accent lands ----
      const c1 = lines[0].caret, c2 = lines[1].caret;
      // idle caret blink before typing
      tl.set(c1, { opacity: 1 }, 0).set(c1, { opacity: 0 }, 0.18).set(c1, { opacity: 1 }, 0.3);
      const typeStart = 0.34, step = 0.046;
      let t = typeStart;
      lines.forEach((ln, li) => {
        if (li === 1) { tl.set(c1, { opacity: 0 }, t).set(c2, { opacity: 1 }, t); t += 0.08; }
        ln.chars.forEach((ch) => { tl.set(ch, { display: 'inline' }, t); t += step; });
      });
      const typedEnd = t; // ~1.98s
      tl.set(c2, { opacity: 0 }, typedEnd + 0.05);
      tl.fromTo('#accent', { yPercent: 100, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.55, ease: 'power3.out' }, typedEnd + 0.08);
      // loop-out: fade the whole headline, chars reset at frame 0
      tl.fromTo('#headline', { opacity: 1 }, { opacity: 0, duration: 0.4, ease: 'power2.in' }, 4.55);

      // ---- card deck: front → back rotation, returns to start at t = 5 ----
      // Back cards are dimmed by an opaque shade, never by card opacity, so nothing bleeds through.
      const SLOTS = [
        { y: 0, scale: 1, zIndex: 3, shade: 0 },
        { y: -76, scale: 0.92, zIndex: 2, shade: 0.5 },
        { y: -146, scale: 0.84, zIndex: 1, shade: 0.78 },
      ];
      const cards = ['#card-agent', '#card-server', '#card-web'];
      const pose = ({ y, scale, zIndex }) => ({ y, scale, zIndex });
      cards.forEach((c, i) => {
        tl.set(c, { ...pose(SLOTS[i]), opacity: 1 }, 0).set(`${c} .shade`, { opacity: SLOTS[i].shade }, 0);
      });
      const switches = [1.45, 3.05, 4.6]; // each lasts 0.4s, the last ends exactly at 5.0
      switches.forEach((s, k) => {
        cards.forEach((c, i) => {
          const from = (i - k + 3) % 3;
          if (from === 0) {
            // front card drops out, then settles at the back
            tl.to(c, { y: 60, opacity: 0, scale: 1.02, duration: 0.2, ease: 'power2.in' }, s)
              .set(c, { ...pose(SLOTS[2]), y: SLOTS[2].y - 20 }, s + 0.2)
              .set(`${c} .shade`, { opacity: SLOTS[2].shade }, s + 0.2)
              .to(c, { opacity: 1, y: SLOTS[2].y, duration: 0.2, ease: 'power2.out' }, s + 0.2);
          } else {
            const to = SLOTS[from - 1];
            tl.set(c, { zIndex: to.zIndex }, s + 0.12)
              .to(c, { y: to.y, scale: to.scale, duration: 0.4, ease: 'power3.inOut' }, s)
              .to(`${c} .shade`, { opacity: to.shade, duration: 0.4, ease: 'power3.inOut' }, s);
          }
        });
      });

      // ---- Agente IA (front 0 → 1.45): question, typing dots, answer, CTA ----
      const pop = (sel, at) => tl.fromTo(sel, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.25, ease: 'back.out(2)' }, at);
      tl.set(['#ag-b1', '#ag-typing', '#ag-b2', '#ag-b3', '#ag-chips'], { opacity: 0 }, 0);
      pop('#ag-b1', 0.15);
      tl.set('#ag-typing', { opacity: 1 }, 0.42);
      tl.fromTo('.ag-dot', { y: 0 }, { y: -4, duration: 0.12, ease: 'sine.inOut', yoyo: true, repeat: 1, stagger: 0.07 }, 0.45);
      tl.set('#ag-typing', { opacity: 0 }, 0.72);
      pop('#ag-b2', 0.72);
      pop('#ag-b3', 0.98);
      pop('#ag-chips', 1.16);
      // reset while the card sits at the back
      tl.set(['#ag-b1', '#ag-b2', '#ag-b3', '#ag-chips'], { opacity: 0 }, 2.4);

      // ---- Servidor (front 1.65 → 3.05): bars fill, last LED turns green, check ----
      const bars = gsap.utils.toArray('.sv-bar');
      tl.set(bars, { attr: { width: 0 } }, 0).set('#sv-check', { opacity: 0, scale: 0.6, transformOrigin: '50% 50%' }, 0)
        .set('#sv-led3', { fill: '#FE5D1C' }, 0).set('.sv-wire', { strokeDashoffset: 0 }, 0);
      bars.forEach((b, i) =>
        tl.to(b, { attr: { width: +b.dataset.w }, duration: 0.6, ease: 'power2.out' }, 1.7 + i * 0.12));
      tl.set('#sv-led3', { fill: '#7CD6B4' }, 2.2);
      tl.to('.sv-wire', { strokeDashoffset: -27, duration: 0.8, ease: 'none' }, 2.0);
      tl.to('#sv-check', { opacity: 1, scale: 1, duration: 0.3, ease: 'back.out(2.4)' }, 2.35);
      tl.to(bars, { attr: { width: 0 }, duration: 0.3, ease: 'power1.inOut' }, 3.9).to('#sv-check', { opacity: 0, scale: 0.6, duration: 0.3 }, 3.9).set('#sv-led3', { fill: '#FE5D1C' }, 4.05);

      // ---- Web (front 3.25 → 4.6): cursor clicks the CTA, result cards rise ----
      tl.set('#web-cursor', { x: 250, y: 200 }, 0).set('.web-card', { opacity: 0, y: 10 }, 0)
        .set('#web-btn', { scale: 1, fill: '#FE5D1C', transformOrigin: '50% 50%' }, 0);
      tl.to('#web-cursor', { x: 84, y: 136, duration: 0.5, ease: 'power3.inOut' }, 3.3)
        .to('#web-btn', { scale: 0.92, duration: 0.08, ease: 'power1.in' }, 3.82)
        .to('#web-cursor', { scale: 0.86, duration: 0.08, transformOrigin: '0 0' }, 3.82)
        .to('#web-btn', { scale: 1, fill: '#FF8D5C', duration: 0.18, ease: 'back.out(3)' }, 3.9)
        .to('#web-cursor', { scale: 1, duration: 0.12 }, 3.9)
        .to('.web-card', { opacity: 1, y: 0, duration: 0.35, ease: 'power3.out', stagger: 0.1 }, 3.98)
        .to('#web-cursor', { x: 250, y: 200, duration: 0.45, ease: 'power2.inOut' }, 4.2)
        // reset while the card is faded out mid-switch (4.6 → 4.8)
        .set('.web-card', { opacity: 0, y: 10 }, 4.8)
        .set('#web-btn', { fill: '#FE5D1C' }, 4.8);

      tl.set({}, {}, D);
      window.__timelines['main'] = tl;
    </script>
  </body>
