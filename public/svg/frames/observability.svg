<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" fill="none">
  <defs>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FE5D1C" stop-opacity=".35"/>
      <stop offset="1" stop-color="#FE5D1C" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="plot"><rect x="30" y="70" width="260" height="120"/></clipPath>
  </defs>
  <style>
    .line { stroke-dasharray: 420; stroke-dashoffset: 420; animation: draw 5s cubic-bezier(.16,1,.3,1) infinite; }
    @keyframes draw { 0% { stroke-dashoffset: 420; } 50%, 88% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 0; opacity: 0; } }
    .area { opacity: 0; animation: area 5s ease infinite; }
    @keyframes area { 0%, 30% { opacity: 0; } 55%, 88% { opacity: 1; } 100% { opacity: 0; } }
    .scan { animation: scan 5s cubic-bezier(.65,0,.35,1) infinite; }
    @keyframes scan { 0% { transform: translateX(0); } 100% { transform: translateX(260px); } }
    .tile { animation: tile 2.6s ease-in-out infinite; }
    .t2 { animation-delay: .4s; } .t3 { animation-delay: .8s; }
    @keyframes tile { 0%, 100% { opacity: .6; } 50% { opacity: 1; } }
    .ping { transform-box: fill-box; transform-origin: center; animation: ping 1.6s ease-out infinite; }
    @keyframes ping { 0% { transform: scale(.6); opacity: .9; } 100% { transform: scale(2.2); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .line { stroke-dashoffset: 0; } .area { opacity: 1; } }
  </style>

  <!-- metric tiles -->
  <g class="tile">
    <rect x="30" y="22" width="78" height="36" rx="9" fill="#F8F3EB" fill-opacity=".05" stroke="#F8F3EB" stroke-opacity=".14"/>
    <rect x="40" y="31" width="26" height="4" rx="2" fill="#F8F3EB" fill-opacity=".35"/>
    <rect x="40" y="41" width="44" height="7" rx="3.5" fill="#7CD6B4"/>
  </g>
  <g class="tile t2">
    <rect x="121" y="22" width="78" height="36" rx="9" fill="#F8F3EB" fill-opacity=".05" stroke="#F8F3EB" stroke-opacity=".14"/>
    <rect x="131" y="31" width="26" height="4" rx="2" fill="#F8F3EB" fill-opacity=".35"/>
    <rect x="131" y="41" width="34" height="7" rx="3.5" fill="#F8F3EB" fill-opacity=".85"/>
  </g>
  <g class="tile t3">
    <rect x="212" y="22" width="78" height="36" rx="9" fill="#F8F3EB" fill-opacity=".05" stroke="#FE5D1C" stroke-opacity=".4"/>
    <rect x="222" y="31" width="26" height="4" rx="2" fill="#F8F3EB" fill-opacity=".35"/>
    <rect x="222" y="41" width="50" height="7" rx="3.5" fill="#FF9E68"/>
    <circle class="ping" cx="280" cy="32" r="3" fill="#FE5D1C"/>
    <circle cx="280" cy="32" r="3" fill="#FE5D1C"/>
  </g>

  <!-- plot -->
  <path d="M30 100 H 290 M30 130 H 290 M30 160 H 290" stroke="#F8F3EB" stroke-opacity=".06"/>
  <path d="M30 190 H 290" stroke="#F8F3EB" stroke-opacity=".14"/>
  <g clip-path="url(#plot)">
    <path class="area" d="M30 170 L56 160 L82 166 L108 142 L134 150 L160 120 L186 132 L212 104 L238 116 L264 92 L290 98 V 190 H 30 Z" fill="url(#area)"/>
    <path class="line" d="M30 170 L56 160 L82 166 L108 142 L134 150 L160 120 L186 132 L212 104 L238 116 L264 92 L290 98" stroke="#FE5D1C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M30 178 L56 176 L82 179 L108 170 L134 174 L160 166 L186 170 L212 160 L238 164 L264 156 L290 158" stroke="#7DA3FF" stroke-opacity=".5" stroke-width="1.4" stroke-dasharray="3 4"/>
    <g class="scan">
      <path d="M30 70 V 190" stroke="#F8F3EB" stroke-opacity=".25"/>
    </g>
  </g>
  <path d="M30 206 h40 M80 206 h24 M114 206 h32" stroke="#F8F3EB" stroke-opacity=".18" stroke-width="3" stroke-linecap="round"/>
</svg>
