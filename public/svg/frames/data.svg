<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" fill="none">
  <style>
    .bar { transform-box: fill-box; transform-origin: center bottom; animation: grow 4.4s cubic-bezier(.16,1,.3,1) infinite; }
    .b2 { animation-delay: .1s; } .b3 { animation-delay: .2s; } .b4 { animation-delay: .3s; } .b5 { animation-delay: .4s; } .b6 { animation-delay: .5s; }
    @keyframes grow { 0% { transform: scaleY(.08); } 30%, 80% { transform: scaleY(1); } 100% { transform: scaleY(.08); } }
    .disk { animation: disk 2.2s ease-in-out infinite; }
    .k2 { animation-delay: .25s; } .k3 { animation-delay: .5s; }
    @keyframes disk { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
    .pipe { stroke-dasharray: 4 6; animation: flow .8s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -20; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <!-- database -->
  <g>
    <path d="M30 70 v96 c0 9 22 16 48 16 s48 -7 48 -16 v-96" fill="#F8F3EB" fill-opacity=".04" stroke="#F8F3EB" stroke-opacity=".18"/>
    <ellipse cx="78" cy="70" rx="48" ry="16" fill="#12192A" stroke="#7DA3FF" stroke-opacity=".6"/>
    <path class="disk" d="M30 102 c0 9 22 16 48 16 s48 -7 48 -16" stroke="#7DA3FF" stroke-opacity=".6"/>
    <path class="disk k2" d="M30 134 c0 9 22 16 48 16 s48 -7 48 -16" stroke="#7DA3FF" stroke-opacity=".6"/>
    <circle class="disk k3" cx="108" cy="92" r="3" fill="#7CD6B4"/>
    <circle class="disk" cx="108" cy="124" r="3" fill="#7CD6B4"/>
    <circle class="disk k2" cx="108" cy="156" r="3" fill="#FE5D1C"/>
  </g>

  <path class="pipe" d="M126 118 H 170" stroke="#7DA3FF" stroke-opacity=".7" stroke-width="1.4"/>

  <!-- chart -->
  <rect x="170" y="44" width="124" height="152" rx="12" fill="#F8F3EB" fill-opacity=".04" stroke="#F8F3EB" stroke-opacity=".14"/>
  <rect x="184" y="58" width="44" height="5" rx="2.5" fill="#F8F3EB" fill-opacity=".6"/>
  <rect x="184" y="68" width="28" height="4" rx="2" fill="#F8F3EB" fill-opacity=".25"/>
  <path d="M184 180 H 280" stroke="#F8F3EB" stroke-opacity=".12"/>
  <rect class="bar" x="186" y="138" width="10" height="42" rx="3" fill="#2B5CE6" fill-opacity=".55"/>
  <rect class="bar b2" x="202" y="122" width="10" height="58" rx="3" fill="#2B5CE6" fill-opacity=".7"/>
  <rect class="bar b3" x="218" y="130" width="10" height="50" rx="3" fill="#2B5CE6" fill-opacity=".55"/>
  <rect class="bar b4" x="234" y="104" width="10" height="76" rx="3" fill="#2B5CE6" fill-opacity=".85"/>
  <rect class="bar b5" x="250" y="112" width="10" height="68" rx="3" fill="#2B5CE6" fill-opacity=".7"/>
  <rect class="bar b6" x="266" y="90" width="10" height="90" rx="3" fill="#FE5D1C"/>
</svg>
