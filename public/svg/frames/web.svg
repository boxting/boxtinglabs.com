<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" fill="none">
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2B5CE6" stop-opacity=".75"/>
      <stop offset="1" stop-color="#2B5CE6" stop-opacity=".08"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F8F3EB" stop-opacity="0"/>
      <stop offset=".5" stop-color="#F8F3EB" stop-opacity=".22"/>
      <stop offset="1" stop-color="#F8F3EB" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="win"><rect x="24" y="26" width="272" height="188" rx="12"/></clipPath>
  </defs>
  <style>
    .shimmer { animation: shimmer 2.6s cubic-bezier(.65,0,.35,1) infinite; }
    @keyframes shimmer { 0% { transform: translateX(-140px); } 100% { transform: translateX(320px); } }
    .cursor { animation: cursor 5s cubic-bezier(.65,0,.35,1) infinite; }
    @keyframes cursor {
      0%   { transform: translate(250px, 190px); }
      35%  { transform: translate(92px, 146px); }
      45%  { transform: translate(92px, 146px) scale(.86); }
      52%  { transform: translate(92px, 146px); }
      80%  { transform: translate(210px, 96px); }
      100% { transform: translate(250px, 190px); }
    }
    .btn { transform-box: fill-box; transform-origin: center; animation: press 5s ease infinite; }
    @keyframes press { 0%, 42% { transform: scale(1); fill: #FE5D1C; } 46% { transform: scale(.94); } 52%, 70% { transform: scale(1); fill: #FF8D5C; } 100% { fill: #FE5D1C; } }
    .card { transform-box: fill-box; transform-origin: center bottom; animation: rise 5s cubic-bezier(.16,1,.3,1) infinite; opacity: 0; }
    .c2 { animation-delay: .12s; } .c3 { animation-delay: .24s; }
    @keyframes rise { 0%, 50% { opacity: 0; transform: translateY(10px); } 60%, 92% { opacity: 1; transform: none; } 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .card { opacity: 1; } .cursor { transform: translate(92px, 146px); } }
  </style>

  <rect x="24" y="26" width="272" height="188" rx="12" fill="#F8F3EB" fill-opacity=".035" stroke="#F8F3EB" stroke-opacity=".14"/>
  <g clip-path="url(#win)">
    <path d="M24 50 H 296" stroke="#F8F3EB" stroke-opacity=".1"/>
    <circle cx="40" cy="38" r="3.5" fill="#FE5D1C"/>
    <circle cx="52" cy="38" r="3.5" fill="#F8F3EB" fill-opacity=".22"/>
    <circle cx="64" cy="38" r="3.5" fill="#F8F3EB" fill-opacity=".22"/>
    <rect x="96" y="32" width="128" height="12" rx="6" fill="#F8F3EB" fill-opacity=".06"/>
    <circle cx="106" cy="38" r="2.5" fill="#7CD6B4"/>
    <rect x="114" y="36.5" width="60" height="3" rx="1.5" fill="#F8F3EB" fill-opacity=".25"/>

    <!-- hero block -->
    <rect x="40" y="64" width="240" height="64" rx="9" fill="url(#hero)"/>
    <rect x="54" y="80" width="104" height="8" rx="4" fill="#F8F3EB" fill-opacity=".9"/>
    <rect x="54" y="94" width="72" height="5" rx="2.5" fill="#F8F3EB" fill-opacity=".45"/>
    <rect class="btn" x="54" y="140" width="68" height="20" rx="10" fill="#FE5D1C"/>
    <rect x="130" y="140" width="56" height="20" rx="10" stroke="#F8F3EB" stroke-opacity=".22"/>

    <!-- result cards -->
    <rect class="card" x="40" y="172" width="74" height="30" rx="7" fill="#F8F3EB" fill-opacity=".06" stroke="#7DA3FF" stroke-opacity=".35"/>
    <rect class="card c2" x="123" y="172" width="74" height="30" rx="7" fill="#F8F3EB" fill-opacity=".06" stroke="#7DA3FF" stroke-opacity=".35"/>
    <rect class="card c3" x="206" y="172" width="74" height="30" rx="7" fill="#F8F3EB" fill-opacity=".06" stroke="#7DA3FF" stroke-opacity=".35"/>

    <rect class="shimmer" x="0" y="26" width="120" height="188" fill="url(#shine)"/>
  </g>

  <!-- cursor -->
  <g class="cursor">
    <path d="M0 0 L0 15 L4 11 L7 18 L10 17 L7 10 L12 10 Z" fill="#F8F3EB" stroke="#08090B" stroke-width="1" stroke-linejoin="round"/>
  </g>
</svg>
