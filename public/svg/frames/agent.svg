<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" fill="none">
  <style>
    .m { opacity: 0; transform-box: fill-box; animation: pop 7s cubic-bezier(.16,1,.3,1) infinite; }
    .m1 { transform-origin: left bottom; animation-delay: 0s; }
    .m2 { transform-origin: right bottom; animation-delay: .9s; }
    .typing { opacity: 0; animation: typing 7s linear infinite; animation-delay: 1.6s; }
    .m3 { transform-origin: left bottom; animation-delay: 3s; }
    .m4 { transform-origin: left bottom; animation-delay: 3.4s; }
    @keyframes pop { 0% { opacity: 0; transform: translateY(8px) scale(.92); } 6%, 82% { opacity: 1; transform: none; } 90%, 100% { opacity: 0; transform: none; } }
    @keyframes typing { 0% { opacity: 0; } 2%, 18% { opacity: 1; } 20%, 100% { opacity: 0; } }
    .dot { animation: bounce 1s ease-in-out infinite; }
    .dot:nth-child(2) { animation-delay: .15s; } .dot:nth-child(3) { animation-delay: .3s; }
    @keyframes bounce { 0%, 100% { transform: translateY(0); opacity: .45; } 40% { transform: translateY(-3px); opacity: 1; } }
    .spark { transform-box: fill-box; transform-origin: center; animation: spin 6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .glow { transform-box: fill-box; transform-origin: center; animation: glow 3s ease-in-out infinite; }
    @keyframes glow { 0%, 100% { opacity: .35; transform: scale(.9); } 50% { opacity: .8; transform: scale(1.1); } }
    .status { animation: status 1.8s ease-in-out infinite; }
    @keyframes status { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .m { opacity: 1; } }
  </style>

  <rect x="36" y="22" width="248" height="196" rx="16" fill="#F8F3EB" fill-opacity=".04" stroke="#F8F3EB" stroke-opacity=".14"/>

  <!-- header -->
  <circle class="glow" cx="60" cy="46" r="13" fill="#FE5D1C" fill-opacity=".25"/>
  <path class="spark" d="M60 36 L62.4 43.6 L70 46 L62.4 48.4 L60 56 L57.6 48.4 L50 46 L57.6 43.6 Z" fill="#FE5D1C"/>
  <rect x="80" y="40" width="58" height="5" rx="2.5" fill="#F8F3EB" fill-opacity=".85"/>
  <circle class="status" cx="84" cy="52" r="2.5" fill="#7CD6B4"/>
  <rect x="90" y="50.5" width="36" height="3" rx="1.5" fill="#F8F3EB" fill-opacity=".3"/>
  <path d="M36 68 H 284" stroke="#F8F3EB" stroke-opacity=".08"/>

  <!-- conversation -->
  <g class="m m1">
    <rect x="52" y="80" width="140" height="24" rx="12" fill="#F8F3EB" fill-opacity=".09"/>
    <rect x="64" y="90" width="100" height="4" rx="2" fill="#F8F3EB" fill-opacity=".55"/>
  </g>
  <g class="m m2">
    <rect x="156" y="112" width="112" height="24" rx="12" fill="#FE5D1C"/>
    <rect x="168" y="122" width="76" height="4" rx="2" fill="#08090B" fill-opacity=".7"/>
  </g>
  <g class="typing">
    <rect x="52" y="144" width="46" height="22" rx="11" fill="#F8F3EB" fill-opacity=".09"/>
    <g>
      <circle class="dot" cx="66" cy="155" r="2.5" fill="#F8F3EB"/>
      <circle class="dot" cx="75" cy="155" r="2.5" fill="#F8F3EB"/>
      <circle class="dot" cx="84" cy="155" r="2.5" fill="#F8F3EB"/>
    </g>
  </g>
  <g class="m m3">
    <rect x="52" y="144" width="176" height="40" rx="12" fill="#F8F3EB" fill-opacity=".09"/>
    <rect x="64" y="154" width="130" height="4" rx="2" fill="#F8F3EB" fill-opacity=".6"/>
    <rect x="64" y="163" width="150" height="4" rx="2" fill="#F8F3EB" fill-opacity=".4"/>
    <rect x="64" y="172" width="84" height="4" rx="2" fill="#F8F3EB" fill-opacity=".4"/>
  </g>
  <g class="m m4">
    <rect x="52" y="192" width="64" height="16" rx="8" stroke="#FE5D1C" stroke-opacity=".6"/>
    <rect x="62" y="198" width="44" height="4" rx="2" fill="#FF9E68"/>
    <rect x="122" y="192" width="56" height="16" rx="8" stroke="#F8F3EB" stroke-opacity=".2"/>
    <rect x="132" y="198" width="36" height="4" rx="2" fill="#F8F3EB" fill-opacity=".4"/>
  </g>
</svg>
