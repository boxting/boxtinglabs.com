<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -8 160 175" fill="none">
  <!-- Boxting cube · assembles: outline draws, body fills, facets fold in, then idles. Loops every 7s. -->
  <style>
    .outline { stroke-dasharray: 560; stroke-dashoffset: 560; animation: draw 7s cubic-bezier(.65,0,.35,1) infinite; }
    @keyframes draw { 0% { stroke-dashoffset: 560; opacity: 1; } 18% { stroke-dashoffset: 0; opacity: 1; } 28%, 100% { stroke-dashoffset: 0; opacity: 0; } }
    .body { opacity: 0; transform-box: fill-box; transform-origin: center; animation: body 7s cubic-bezier(.16,1,.3,1) infinite; }
    @keyframes body { 0%, 16% { opacity: 0; transform: scale(.96); } 26%, 92% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1); } }
    .top { opacity: 0; animation: top 7s cubic-bezier(.34,1.56,.64,1) infinite; }
    @keyframes top { 0%, 24% { opacity: 0; transform: translateY(-26px); } 34%, 92% { opacity: 1; transform: none; } 100% { opacity: 0; } }
    .left { opacity: 0; animation: left 7s cubic-bezier(.34,1.56,.64,1) infinite; }
    @keyframes left { 0%, 30% { opacity: 0; transform: translate(-24px, 14px); } 40%, 92% { opacity: 1; transform: none; } 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .body, .top, .left { opacity: 1; } .outline { opacity: 0; } }
  </style>
