<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <style>
    .l { transform-box: fill-box; transform-origin: left center; animation: type 3.6s steps(8) infinite; }
    .l2 { animation-delay: .6s; } .l3 { animation-delay: 1.2s; }
    @keyframes type { 0% { transform: scaleX(0); } 40%, 85% { transform: scaleX(1); } 100% { transform: scaleX(0); } }
    .caret { animation: caret 1s steps(1) infinite; }
    @keyframes caret { 50% { opacity: 0; } }
    .br { animation: br 3.6s cubic-bezier(.16,1,.3,1) infinite; }
    .br-r { animation-name: br-r; }
    @keyframes br { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(-3px); } }
    @keyframes br-r { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(3px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect x="8" y="14" width="80" height="68" rx="12" fill="#F8F3EB" fill-opacity=".04" stroke="#F8F3EB" stroke-opacity=".16"/>
  <path class="br" d="M22 38 L14 48 L22 58" stroke="#FE5D1C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="br br-r" d="M74 38 L82 48 L74 58" stroke="#FE5D1C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="l" x="30" y="36" width="30" height="4" rx="2" fill="#F8F3EB" fill-opacity=".8"/>
  <rect class="l l2" x="34" y="46" width="28" height="4" rx="2" fill="#7DA3FF"/>
  <rect class="l l3" x="30" y="56" width="20" height="4" rx="2" fill="#F8F3EB" fill-opacity=".5"/>
  <rect class="caret" x="53" y="55" width="2" height="6" fill="#FE5D1C"/>
</svg>
