<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <style>
    .a { animation: a 4s cubic-bezier(.16,1,.3,1) infinite; transform-box: fill-box; transform-origin: left bottom; }
    .b { animation: a 4s cubic-bezier(.16,1,.3,1) infinite; animation-delay: 1s; transform-box: fill-box; transform-origin: right bottom; }
    @keyframes a { 0% { transform: scale(.85); opacity: 0; } 12%, 80% { transform: scale(1); opacity: 1; } 100% { opacity: 0; } }
    .dot { animation: dot 1s ease-in-out infinite; }
    .dot:nth-of-type(2) { animation-delay: .15s; } .dot:nth-of-type(3) { animation-delay: .3s; }
    @keyframes dot { 0%, 100% { transform: translateY(0); opacity: .5; } 40% { transform: translateY(-2px); opacity: 1; } }
    .chk { stroke-dasharray: 20; stroke-dashoffset: 20; animation: chk 4s ease infinite; animation-delay: 1s; }
    @keyframes chk { 0%, 10% { stroke-dashoffset: 20; } 25%, 80% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 0; opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .chk { stroke-dashoffset: 0; } }
  </style>
  <g class="a">
    <path d="M12 22 h40 a8 8 0 0 1 8 8 v14 a8 8 0 0 1 -8 8 H28 l-10 8 v-8 h-6 a8 8 0 0 1 -8 -8 V30 a8 8 0 0 1 8 -8 Z" fill="#F8F3EB" fill-opacity=".05" stroke="#F8F3EB" stroke-opacity=".28" stroke-linejoin="round"/>
    <g>
      <circle class="dot" cx="22" cy="37" r="2.5" fill="#F8F3EB"/>
      <circle class="dot" cx="32" cy="37" r="2.5" fill="#F8F3EB"/>
      <circle class="dot" cx="42" cy="37" r="2.5" fill="#F8F3EB"/>
    </g>
  </g>
  <g class="b">
    <path d="M44 48 h36 a8 8 0 0 1 8 8 v12 a8 8 0 0 1 -8 8 h-4 v8 l-10 -8 H44 a8 8 0 0 1 -8 -8 V56 a8 8 0 0 1 8 -8 Z" fill="#FE5D1C"/>
    <path class="chk" d="M54 62 l5 5 l10 -10" stroke="#08090B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
