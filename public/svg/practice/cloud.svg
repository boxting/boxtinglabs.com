<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <style>
    .up { animation: up 2.4s cubic-bezier(.65,0,.35,1) infinite; opacity: 0; }
    .u2 { animation-delay: .8s; } .u3 { animation-delay: 1.6s; }
    @keyframes up { 0% { transform: translateY(14px); opacity: 0; } 30% { opacity: 1; } 70% { opacity: 1; } 100% { transform: translateY(-10px); opacity: 0; } }
    .cloud { animation: bob 4s ease-in-out infinite; }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
    .led { animation: led 1.4s steps(1) infinite; }
    .led2 { animation-delay: .7s; }
    @keyframes led { 50% { opacity: .25; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .up { opacity: 1; } }
  </style>
  <path class="cloud" d="M30 44 a14 14 0 0 1 27-6 a11 11 0 0 1 12 17 H30 a8 8 0 0 1 0-11 Z" fill="#F8F3EB" fill-opacity=".05" stroke="#7DA3FF" stroke-width="1.8" stroke-linejoin="round"/>
  <g>
    <path class="up" d="M40 62 V 52 M36.5 55.5 L40 52 L43.5 55.5" stroke="#FE5D1C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <path class="up u2" d="M50 62 V 52 M46.5 55.5 L50 52 L53.5 55.5" stroke="#FE5D1C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <path class="up u3" d="M60 62 V 52 M56.5 55.5 L60 52 L63.5 55.5" stroke="#FE5D1C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <rect x="24" y="66" width="48" height="10" rx="3" fill="#F8F3EB" fill-opacity=".05" stroke="#F8F3EB" stroke-opacity=".18"/>
  <rect x="24" y="78" width="48" height="10" rx="3" fill="#F8F3EB" fill-opacity=".05" stroke="#F8F3EB" stroke-opacity=".18"/>
  <circle class="led" cx="31" cy="71" r="1.8" fill="#7CD6B4"/>
  <circle class="led led2" cx="31" cy="83" r="1.8" fill="#7CD6B4"/>
  <path d="M38 71 h24 M38 83 h18" stroke="#F8F3EB" stroke-opacity=".25" stroke-linecap="round"/>
</svg>
