<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <style>
    .core { transform-box: fill-box; transform-origin: center; animation: breathe 3s ease-in-out infinite; }
    @keyframes breathe { 0%, 100% { transform: scale(1) rotate(0deg); } 50% { transform: scale(1.12) rotate(45deg); } }
    .orbit { transform-origin: 48px 48px; animation: spin 8s linear infinite; }
    .orbit2 { animation-duration: 12s; animation-direction: reverse; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .halo { transform-box: fill-box; transform-origin: center; animation: halo 3s ease-out infinite; }
    @keyframes halo { 0% { transform: scale(.7); opacity: .6; } 100% { transform: scale(1.6); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <circle cx="48" cy="48" r="32" stroke="#F8F3EB" stroke-opacity=".12" stroke-dasharray="2 5"/>
  <circle cx="48" cy="48" r="20" stroke="#F8F3EB" stroke-opacity=".1"/>
  <circle class="halo" cx="48" cy="48" r="14" stroke="#FE5D1C"/>
  <path class="core" d="M48 32 L52 44 L64 48 L52 52 L48 64 L44 52 L32 48 L44 44 Z" fill="#FE5D1C"/>
  <g class="orbit"><circle cx="80" cy="48" r="4" fill="#7DA3FF"/></g>
  <g class="orbit orbit2"><circle cx="48" cy="28" r="3" fill="#7CD6B4"/><circle cx="48" cy="68" r="2.5" fill="#C77DBC"/></g>
</svg>
